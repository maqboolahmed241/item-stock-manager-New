name: Build Rack Stock APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'native-bridge.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: mkdir -p www && cp index.html www/index.html && npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add Android Save As backup plugin
        run: |
          mkdir -p android/app/src/main/java/com/maqbool/rackstock/v2
          cat > android/app/src/main/java/com/maqbool/rackstock/v2/MainActivity.java <<'EOF'
          package com.maqbool.rackstock.v2;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BackupSaverPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          cat > android/app/src/main/java/com/maqbool/rackstock/v2/BackupSaverPlugin.java <<'EOF'
          package com.maqbool.rackstock.v2;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "BackupSaver")
          public class BackupSaverPlugin extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              String filename = call.getString("filename", "Rack-Stock-Backup.json");
              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
              intent.addCategory(Intent.CATEGORY_OPENABLE);
              intent.setType("application/json");
              intent.putExtra(Intent.EXTRA_TITLE, filename);
              startActivityForResult(call, intent, "handleSaveResult");
            }
            @ActivityCallback
            private void handleSaveResult(PluginCall call, ActivityResult result) {
              if (call == null) return;
              if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                call.reject("Save cancelled");
                return;
              }
              Uri uri = result.getData().getData();
              try {
                String content = call.getString("content", "");
                OutputStream stream = getContext().getContentResolver().openOutputStream(uri);
                if (stream == null) throw new Exception("Could not open selected file");
                stream.write(content.getBytes(StandardCharsets.UTF_8));
                stream.flush();
                stream.close();
                JSObject ret = new JSObject();
                ret.put("uri", uri.toString());
                ret.put("saved", true);
                call.resolve(ret);
              } catch (Exception e) {
                call.reject("Could not save backup: " + e.getMessage(), e);
              }
            }
          }
          EOF
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rack-stock-management-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
